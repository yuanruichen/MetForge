# MetForge Codex Agents
############################################################

[agents.default]
description = "General-purpose assistant for coding, planning, debugging, and documentation."

[agents.processor]
description = "Handles scientific data ingestion, xarray/dask workflows, reproducible processing, and run logs."
config_file = "agents/processor.toml"

[agents.plotter]
description = "Specialist in scientific visualization with matplotlib, cartopy, seaborn, and xarray."
config_file = "agents/plotter.toml"

[agents.orchestrator]
description = "Coordinates multi-step scientific workflows and checks deliverables."
config_file = "agents/orchestrator.toml"
